<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sunset orange: soft amber into Crunchyroll orange into a deep ember -->
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset="0.5" stop-color="#F47521"/>
      <stop offset="1" stop-color="#D9431C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF4"/>
      <stop offset="1" stop-color="#FFE3CF"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="58" cy="64" r="36" fill="#fff"/>
      <circle cx="76" cy="56" r="29" fill="#000"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8A2A0A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#sky)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#glow)"/>

  <!-- Sleepy crescent cradling a play button -->
  <g filter="url(#soft)">
    <rect width="128" height="128" fill="url(#cream)" mask="url(#crescent)"/>
    <path d="M71 47 L71 69 L89 58 Z" fill="url(#cream)" stroke="#FFF6EC" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <path d="M33 66 Q38 71 43 66" fill="none" stroke="#C7461A" stroke-width="3.6" stroke-linecap="round"/>
  <ellipse cx="35" cy="78" rx="4.5" ry="3" fill="#FF8F6B" opacity="0.75"/>
</svg>
