<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Dusk sky: warm peach fading through rose into soft violet -->
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFC09A"/>
      <stop offset="0.48" stop-color="#EE8FA6"/>
      <stop offset="1" stop-color="#7A66D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF4"/>
      <stop offset="1" stop-color="#FFE3CF"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="60" cy="66" r="31" fill="#fff"/>
      <circle cx="75" cy="54" r="27" fill="#000"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4B2E83" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#sky)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <rect x="0" y="0" width="128" height="128" fill="url(#moon)" mask="url(#crescent)"/>
  </g>

  <circle cx="90" cy="40" r="3.2" fill="#FFF7EE" opacity="0.95"/>
  <circle cx="99" cy="56" r="1.9" fill="#FFF7EE" opacity="0.8"/>
  <circle cx="80" cy="28" r="1.5" fill="#FFF7EE" opacity="0.7"/>
</svg>
